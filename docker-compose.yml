services:
  backend:
    build: ./backend
    init: true
    ports:
      - "${HOST_PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
      - path: backend/.env
        required: false
    environment:
      - PORT=3000      # must match the container port in 'ports' above
      - NODE_ENV=production
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
